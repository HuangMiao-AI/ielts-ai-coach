<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">Riverside Park before and after redevelopment</title><desc id="desc">Side-by-side maps of the fictional park in 2010 and 2025.</desc><rect width="760" height="470" rx="18" fill="#fff"/><text x="380" y="38" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#102a2e">Riverside Park redevelopment</text>
