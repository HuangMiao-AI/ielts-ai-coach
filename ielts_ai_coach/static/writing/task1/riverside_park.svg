  <g stroke="#456b70" stroke-width="2"><rect x="40" y="90" width="320" height="300" rx="14" fill="#dff2d2"/><rect x="400" y="90" width="320" height="300" rx="14" fill="#dff2d2"/></g>
  <g font-family="Arial" font-size="14" text-anchor="middle"><ellipse cx="205" cy="235" rx="62" ry="42" fill="#9fd7ee" stroke="#337d9e"/><text x="205" y="240">Pond</text><path d="M55 325H340" stroke="#d7b27a" stroke-width="18"/><text x="200" y="332">Straight path</text><rect x="290" y="105" width="55" height="82" fill="#c9ced2"/><text x="317" y="138">Car</text><text x="317" y="157">park</text><text x="105" y="160">Open grass</text><text x="245" y="365">River</text><path d="M40 380H360" stroke="#4aa6c4" stroke-width="14"/>
