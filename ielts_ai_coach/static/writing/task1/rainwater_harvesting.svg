<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">Domestic rainwater harvesting process</title><desc id="desc">Seven-stage process from roof collection to household reuse.</desc><rect width="760" height="470" rx="18" fill="#fff"/><text x="380" y="42" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#102a2e">Domestic rainwater harvesting</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker></defs>
  <g font-family="Arial" text-anchor="middle"><g fill="#e8f5f2" stroke="#0f766e" stroke-width="2"><rect x="45" y="105" width="130" height="70" rx="12"/><rect x="225" y="105" width="130" height="70" rx="12"/><rect x="405" y="105" width="130" height="70" rx="12"/><rect x="585" y="105" width="130" height="70" rx="12"/><rect x="495" y="285" width="130" height="70" rx="12"/><rect x="225" y="285" width="180" height="70" rx="12"/><rect x="45" y="285" width="130" height="70" rx="12"/></g>
  <g font-size="16" font-weight="700" fill="#102a2e"><text x="110" y="135">1. Roof</text><text x="110" y="157">collection</text><text x="290" y="135">2. Gutter</text><text x="290" y="157">and pipe</text><text x="470" y="145">3. Filter</text><text x="650" y="135">4. Storage</text><text x="650" y="157">tank</text><text x="560" y="325">5. Pump</text><text x="315" y="315">6. Toilets and laundry</text><text x="315" y="338">reuse (non-drinking)</text><text x="110" y="315">Overflow</text><text x="110" y="338">to garden</text></g></g>
  <g fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"><path d="M175 140H215"/><path d="M355 140H395"/><path d="M535 140H575"/><path d="M620 175V245H560V275"/><path d="M495 320H415"/><path d="M690 175V225H110V275"/></g><text x="380" y="415" text-anchor="middle" font-family="Arial" font-size="15" fill="#48656a">Collected water is filtered and stored before reuse; surplus water irrigates the garden.</text>
</svg>
